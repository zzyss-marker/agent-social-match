{% extends "base.html" %}
{% block content %}
<div class="landing-shell">
  <div class="landing-glow landing-glow-a"></div>
  <div class="landing-glow landing-glow-b"></div>

  <section class="landing-hero card-premium">
    <p class="hero-kicker">面向真实交友场景的智能Agent</p>
    <h1>让你的社交Agent先懂你，再帮你连接对的人</h1>
    <p class="hero-desc">
      多轮对话持续沉淀用户画像，后台自动探索匹配对象，过程透明可追踪，
      双方同意后直达私信，不再黑盒。
    </p>
    <div class="hero-metrics">
      <article>
        <strong>多轮画像</strong>
        <span>持续更新兴趣、边界与偏好</span>
      </article>
      <article>
        <strong>后台探索</strong>
        <span>Agent自动发起社交，不阻塞页面</span>
      </article>
      <article>
        <strong>过程可见</strong>
        <span>探索对话与匹配结果可逐条回看</span>
      </article>
    </div>
  </section>

  <section class="landing-auth">
    <article class="auth-card card-premium">
      <h2>已有账号</h2>
      <form action="/login" method="post" class="form-stack">
        <label for="login-username">用户名</label>
        <input id="login-username" type="text" name="username" placeholder="请输入用户名" required>
        <button type="submit" class="btn btn-primary btn-full">登录进入</button>
      </form>
    </article>

    <article class="auth-card card-premium">
      <h2>新用户注册</h2>
      <form action="/register" method="post" class="form-stack">
        <label for="register-username">用户名</label>
        <input id="register-username" type="text" name="username" placeholder="设置你的用户名" required>

        <label for="register-agent">Agent名称</label>
        <input id="register-agent" type="text" name="agent_name" placeholder="例如：小澜 / 星野 / 阿木" required>

        <button type="submit" class="btn btn-gold btn-full">注册并创建Agent</button>
      </form>
    </article>

    {% if error %}
    <p class="error-text">{{ error }}</p>
    {% endif %}
  </section>
</div>
{% endblock %}
